name: Fix AVAudioSession route types v2

on:
  push:
    branches:
      - agent/fix-headphone-route-pause

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-headphone-route-pause
          fetch-depth: 0
      - name: Apply fix and commit
        shell: bash
        run: |
          set -euo pipefail
          file='MeloX/Core/Playback/Engine/AudioPlaybackEngine.swift'
          grep -Fq 'as? AVAudioSession.Route' "$file"
          grep -Fq 'previousRoute: AVAudioSession.Route' "$file"
          grep -Fq 'currentRoute: AVAudioSession.Route' "$file"
          grep -Fq '_ output: AVAudioSession.PortDescription' "$file"
          perl -0pi -e 's/as\? AVAudioSession\.Route/as? AVAudioSessionRouteDescription/g; s/previousRoute: AVAudioSession\.Route,/previousRoute: AVAudioSessionRouteDescription,/g; s/currentRoute: AVAudioSession\.Route/currentRoute: AVAudioSessionRouteDescription/g; s/_ output: AVAudioSession\.PortDescription/_ output: AVAudioSessionPortDescription/g' "$file"
          ! grep -Fq 'AVAudioSession.Route' "$file"
          ! grep -Fq 'AVAudioSession.PortDescription' "$file"
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/fix-avfoundation-route-types.yml .github/workflows/fix-avfoundation-route-types-v2.yml .github/fix-avfoundation-route-types.trigger
          git add "$file"
          git commit -m 'fix: correct AVAudioSession route types' -m 'Co-authored-by: ChatGPT <noreply@openai.com>'
          git push origin HEAD:agent/fix-headphone-route-pause
